name: Repository Dispatch Proxy

# repository_dispatch preserves the existing Bitrise flow. workflow_dispatch allows a
# maintainer to start releases from master without a cross-repository token. Manual
# same-version retries require override and pass the CocoaPods, age, and merged-PR guards.
on:
  repository_dispatch:
    types: [from_bitrise]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (x.y.z)"
        required: true
        type: string
      override:
        description: "Redo a same-version release that failed part-way (an existing release or tag must be less than 24h old)"
        required: false
        default: false
        type: boolean
      release_notes:
        description: "Markdown release notes (single line in the UI; for multi-line use release_notes_b64)"
        required: false
        type: string
      release_notes_b64:
        description: "Base64-encoded markdown release notes (use for multi-line notes)"
        required: false
        type: string

concurrency:
  group: public-sdk-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: macos-latest
    env:
      DEFAULT_BRANCH: master
      EVENT_NAME: ${{ github.event_name }}
      WORKFLOW_REF: ${{ github.ref }}
      DISPATCH_VERSION: ${{ github.event.client_payload.version }}
      DISPATCH_RELEASE_NOTES: ${{ github.event.client_payload.release_notes }}
      DISPATCH_RELEASE_NOTES_B64: ${{ github.event.client_payload.release_notes_b64 }}
      DISPATCH_ARTIFACTS_JSON: ${{ toJson(github.event.client_payload.artifacts) }}
      CALLER: ${{ github.event.client_payload.caller }}
      DISPATCH_COMMIT_SHA: ${{ github.event.client_payload.commit_sha }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_OVERRIDE: ${{ inputs.override }}
      INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
      INPUT_RELEASE_NOTES_B64: ${{ inputs.release_notes_b64 }}

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          fetch-depth: 0

      - name: Normalize release inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$WORKFLOW_REF" != "refs/heads/master" ]]; then
              echo "Manual releases must be run from master (got $WORKFLOW_REF)." >&2
              exit 1
            fi
            version="$INPUT_VERSION"
            override="$INPUT_OVERRIDE"
            if [[ "$override" != "true" && "$override" != "false" ]]; then
              echo "override must be true or false." >&2
              exit 1
            fi
            pinned_commit=$(git rev-parse origin/master)
            artifacts_json=$(python3 - "$version" <<'PY'
          import json, sys
          version = sys.argv[1]
          base = f"https://orch.seondev.space/native/sdk-releases/bundled-sdk/ios/{version}"
          print(json.dumps([
              {"name": "SEONOrchSDK_SPM.zip", "url": f"{base}/SEONOrchSDK_SPM.zip"},
              {"name": "SEONOrchSDK_POD.zip", "url": f"{base}/SEONOrchSDK_POD.zip"},
          ], separators=(",", ":")))
          PY
            )
          else
            version="$DISPATCH_VERSION"
            pinned_commit="$DISPATCH_COMMIT_SHA"
            artifacts_json="${DISPATCH_ARTIFACTS_JSON:-[]}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '$version'; expected strict x.y.z (for example 1.2.3)." >&2
            exit 1
          fi
          if [[ ! "$pinned_commit" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "PINNED_COMMIT must be a full Git commit SHA." >&2
            exit 1
          fi
          artifacts_json=$(python3 - "$artifacts_json" <<'PY'
          import json, sys
          payload = json.loads(sys.argv[1]) if sys.argv[1] else []
          if not isinstance(payload, list) or any(not isinstance(item, dict) for item in payload):
              raise SystemExit("Artifact payload must be a JSON array of objects")
          print(json.dumps(payload, separators=(",", ":")))
          PY
          )
          {
            printf 'VERSION=%s\n' "$version"
            printf 'PINNED_COMMIT=%s\n' "$pinned_commit"
            printf 'ARTIFACTS_JSON=%s\n' "$artifacts_json"
          } >> "$GITHUB_ENV"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf 'OVERRIDE=%s\n' "$override" >> "$GITHUB_ENV"
          else
            printf 'OVERRIDE=false\n' >> "$GITHUB_ENV"
          fi

          release_notes=""
          if [[ "$EVENT_NAME" == "repository_dispatch" && -n "${DISPATCH_RELEASE_NOTES_B64:-}" ]]; then
            release_notes=$(python3 -c 'import base64,sys; sys.stdout.write(base64.b64decode(sys.argv[1]).decode("utf-8"))' "$DISPATCH_RELEASE_NOTES_B64")
          elif [[ "$EVENT_NAME" == "repository_dispatch" && -n "${DISPATCH_RELEASE_NOTES:-}" ]]; then
            release_notes="$DISPATCH_RELEASE_NOTES"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "${INPUT_RELEASE_NOTES_B64:-}" ]]; then
            release_notes=$(python3 -c 'import base64,sys; sys.stdout.write(base64.b64decode(sys.argv[1]).decode("utf-8"))' "$INPUT_RELEASE_NOTES_B64")
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "${INPUT_RELEASE_NOTES:-}" ]]; then
            release_notes="$INPUT_RELEASE_NOTES"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' "One of release_notes / release_notes_b64 is required. Example: gh workflow run check_bitrise_repository_dispatch.yaml --ref master -f version=X.Y.Z -f override=false -f release_notes_b64=\"\$(base64 < notes.md | tr -d '\\n')\"" >&2
            exit 1
          fi
          if [[ -z "$release_notes" ]] || ! grep -q '[^[:space:]]' <<< "$release_notes"; then
            echo "Release notes are empty." >&2
            exit 1
          fi
          release_notes_b64=$(printf '%s' "$release_notes" | base64 | tr -d '\n')
          printf 'RELEASE_NOTES_B64=%s\n' "$release_notes_b64" >> "$GITHUB_ENV"
          echo "Normalized release inputs for v$version."

      - name: Validate artifact URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$ARTIFACTS_JSON" <<'PY'
          import json, sys
          arr = json.loads(sys.argv[1]) if sys.argv[1] else []
          names = {(item.get("name") or "").lower() for item in arr}
          if not {"seonorchsdk_spm.zip", "seonorchsdk_pod.zip"}.issubset(names):
              raise SystemExit("Artifact payload must include SEONOrchSDK_SPM.zip and SEONOrchSDK_POD.zip")
          PY

      - name: Check release guards and apply manual override
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          docs_branch="documentation/${VERSION}"

          # Read-only preflight: all three override guards run before any cleanup.
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$OVERRIDE" == "true" ]]; then
            pod_versions=$(curl -fsS https://trunk.cocoapods.org/api/v1/pods/SEONOrchSDK)
            pod_has_version=$(POD_VERSIONS_JSON="$pod_versions" python3 - "$VERSION" <<'PY'
          import json, os, sys
          version = sys.argv[1]
          data = json.loads(os.environ["POD_VERSIONS_JSON"])
          versions = data if isinstance(data, list) else data.get("versions", [])
          print("true" if any((item.get("name") if isinstance(item, dict) else item) == version for item in versions) else "false")
          PY
            )
            if [[ "$pod_has_version" == "true" ]]; then
              echo "v${VERSION} is already on CocoaPods; bump the version." >&2
              exit 1
            fi

            release_err=$(mktemp)
            if release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>"$release_err"); then
              release_is_old=$(printf '%s' "$release_json" | python3 -c 'import json,sys; from datetime import datetime,timezone; created=datetime.fromisoformat(json.load(sys.stdin)["created_at"].replace("Z", "+00:00")); print("true" if (datetime.now(timezone.utc)-created).total_seconds() > 86400 else "false")')
              if [[ "$release_is_old" == "true" ]]; then
                echo "Release ${tag} is older than 24 hours; refusing override." >&2
                exit 1
              fi
            elif ! grep -q 'HTTP 404' "$release_err"; then
              cat "$release_err" >&2
              exit 1
            else
              tag_err=$(mktemp)
              set +e
              git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>"$tag_err"
              tag_status=$?
              set -e
              if (( tag_status == 0 )); then
                rm -f "$tag_err"
                git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
                tag_created=$(git for-each-ref --format='%(if)%(taggerdate)%(then)%(taggerdate:unix)%(else)%(committerdate:unix)%(end)' "refs/tags/${tag}")
                now=$(date +%s)
                if (( now - tag_created > 86400 )); then
                  echo "Tag ${tag} is older than 24 hours; refusing override." >&2
                  exit 1
                fi
              elif (( tag_status != 2 )); then
                cat "$tag_err" >&2
                rm -f "$tag_err"
                exit 1
              fi
              rm -f "$tag_err"
            fi
            rm -f "$release_err"

            merged_prs=$(gh pr list --state merged --base master --head "$docs_branch" --json number)
            if [[ "$(printf '%s' "$merged_prs" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" -gt 0 ]]; then
              echo "A PR from ${docs_branch} into master is already merged; refusing override." >&2
              exit 1
            fi
          else
            tag_err=$(mktemp)
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>"$tag_err"
            tag_status=$?
            set -e
            if (( tag_status == 0 )); then
              rm -f "$tag_err"
              echo "Tag ${tag} already exists; use workflow_dispatch with override=true to retry a recent failed release." >&2
              exit 1
            elif (( tag_status != 2 )); then
              cat "$tag_err" >&2
              rm -f "$tag_err"
              exit 1
            fi
            rm -f "$tag_err"
            release_err=$(mktemp)
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>"$release_err"; then
              rm -f "$release_err"
              echo "Release ${tag} already exists; use workflow_dispatch with override=true to retry a recent failed release." >&2
              exit 1
            elif ! grep -q 'HTTP 404' "$release_err"; then
              cat "$release_err" >&2
              rm -f "$release_err"
              exit 1
            fi
            rm -f "$release_err"
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$OVERRIDE" == "true" ]]; then
            open_prs=$(gh pr list --state open --base master --head "$docs_branch" --json number)
            while IFS= read -r pr_number; do
              [[ -z "$pr_number" ]] && continue
              gh pr comment "$pr_number" --body "Closing this incomplete release PR to retry v${VERSION} via the guarded manual release workflow."
              gh pr close "$pr_number"
              echo "Commented on and closed docs PR #${pr_number}."
            done < <(printf '%s' "$open_prs" | python3 -c 'import json,sys; print("\n".join(str(pr["number"]) for pr in json.load(sys.stdin)))')

            release_err=$(mktemp)
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>"$release_err"; then
              rm -f "$release_err"
              gh release delete "$tag" --yes
              echo "Deleted release ${tag}."
            elif grep -q 'HTTP 404' "$release_err"; then
              rm -f "$release_err"
              echo "Release ${tag} is absent; nothing to delete."
            else
              cat "$release_err" >&2
              rm -f "$release_err"
              exit 1
            fi
            tag_err=$(mktemp)
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>"$tag_err"
            tag_status=$?
            set -e
            if (( tag_status == 0 )); then
              rm -f "$tag_err"
              git push origin --delete "refs/tags/${tag}"
              echo "Deleted tag ${tag}."
            elif (( tag_status == 2 )); then
              rm -f "$tag_err"
              echo "Tag ${tag} is absent; nothing to delete."
            else
              cat "$tag_err" >&2
              rm -f "$tag_err"
              exit 1
            fi
            branch_err=$(mktemp)
            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${docs_branch}" 2>"$branch_err"; then
              echo "Deleted branch ${docs_branch}."
            elif grep -q 'HTTP 404' "$branch_err"; then
              echo "Branch ${docs_branch} is absent; nothing to delete."
            else
              cat "$branch_err" >&2
              rm -f "$branch_err"
              exit 1
            fi
            rm -f "$branch_err"
            {
              echo "## Guarded override for v${VERSION}"
              echo "- CocoaPods does not list this version."
              echo "- Existing release or tag is absent or was created within the last 24 hours."
              echo "- No merged documentation/${VERSION} PR into master exists."
              echo "- Cleanup completed idempotently for the open PR, release, tag, and docs branch."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout pinned commit
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          ref: ${{ env.PINNED_COMMIT }}
          fetch-depth: 0

      - name: Tool sanity
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          gh --version || true

      - name: Restore release notes file
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import base64,os,sys; sys.stdout.buffer.write(base64.b64decode(os.environ["RELEASE_NOTES_B64"]))' > release_notes.txt

      - name: Extract artifact URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$ARTIFACTS_JSON" "$VERSION" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          arr = json.loads(sys.argv[1]) if sys.argv[1] else []
          urls = {}
          for item in arr:
              name = (item.get("name") or "").lower()
              if name.endswith("seonorchsdk_spm.zip"):
                  urls["STD_URL"] = item.get("url") or ""
              elif name.endswith("seonorchsdk_pod.zip"):
                  urls["POD_URL"] = item.get("url") or ""
          if not urls.get("STD_URL") or not urls.get("POD_URL"):
              raise SystemExit("Could not find both artifact URLs")
          for key in ("STD_URL", "POD_URL"):
              print(f"{key}={urls[key]}")
          PY

      - name: Download artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fL "${STD_URL}" -o dist/SEONOrchSDK_SPM.zip
          curl -fL "${POD_URL}" -o dist/SEONOrchSDK_POD.zip
          ls -lh dist

      - name: Compute checksums
        shell: bash
        run: |
          set -euo pipefail
          CS_STD=$(swift package compute-checksum "dist/SEONOrchSDK_SPM.zip")
          echo "CS_STD=$CS_STD" >> "$GITHUB_ENV"
          echo "STD checksum: $CS_STD"

      - name: Prepare git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create branch from pinned commit and make release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "documentation/${VERSION}" "${PINNED_COMMIT}"

          python3 - "$VERSION" "$CS_STD" <<'PY'
          import sys, re, pathlib
          version, checksum = sys.argv[1], sys.argv[2]
          p = pathlib.Path("Package.swift")
          s = p.read_text()
          s = re.sub(r'url:\s*"(https://github\.com/seontechnologies/seon-orchestration-sdk-ios-public/releases/download/)[^"]+"',
                     rf'url: "\1v{version}/SEONOrchSDK_SPM.zip"', s)
          s = re.sub(r'checksum:\s*"[0-9a-fA-F]+"', f'checksum: "{checksum}"', s)
          p.write_text(s)
          PY

          python3 - "$VERSION" <<'PY'
          import sys, pathlib, re
          version = sys.argv[1]
          notes = pathlib.Path("release_notes.txt").read_text()
          readme = pathlib.Path("README.md")
          text = readme.read_text()
          match = re.search(r'(^#\s*Changelog\s*\n)', text, re.M)
          if not match:
              raise SystemExit("README.md must contain a '# Changelog' heading")
          entry = f"## {version}\n{notes}\n\n"
          readme.write_text(text[:match.end()] + entry + text[match.end():])
          PY

          git add Package.swift README.md
          git commit -m "Release: v${VERSION}"
          git push --set-upstream origin "documentation/${VERSION}"
          gh pr create \
            --title "Release: v${VERSION}" \
            --body-file release_notes.txt \
            --base "${DEFAULT_BRANCH}" \
            --head "documentation/${VERSION}" \
            --draft=false
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" \
            dist/SEONOrchSDK_SPM.zip \
            dist/SEONOrchSDK_POD.zip \
            --title "v${VERSION}" \
            --notes-file release_notes.txt
